# perfetto config: native heap profile of the app from its start (sampling 8 MiB).
# Start before launch.sh:
#   cat tools/nx2/android/heapprofd.cfg | adb shell "perfetto --txt -c - -o /data/misc/perfetto-traces/eden_heap.pftrace --background"
# Known issue: the client disconnects ~25-35 s in (client_error), so only boot gets profiled.
buffers { size_kb: 262144 fill_policy: DISCARD }
data_sources {
  config {
    name: "android.heapprofd"
    heapprofd_config {
      sampling_interval_bytes: 8388608
      process_cmdline: "dev.eden.nx2.relWithDebInfo"
      shmem_size_bytes: 134217728
      block_client: true
      block_client_timeout_us: 2000000
      continuous_dump_config { dump_phase_ms: 15000 dump_interval_ms: 10000 }
    }
  }
}
duration_ms: 180000
