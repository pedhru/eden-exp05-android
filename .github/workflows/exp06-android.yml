name: Eden EXP06 Android ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host dependencies and pinned toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools build-essential pkg-config python3-venv
          python3 -m venv .venv
          .venv/bin/pip install cmake==3.31.6 ninja==1.13.0
          sdkmanager 'ndk;28.2.13676358' 'build-tools;35.0.0'
      - name: Build, package and verify
        run: bash .ci/android/build-exp06-actions.sh
      - name: Upload APK and verification
        uses: actions/upload-artifact@v4
        with:
          name: Eden-EXP06-ARM64
          path: |
            artifacts/Eden_NX2_Android_EXP06.apk
            artifacts/APK_verification.json
            artifacts/SHA256SUMS.txt
            artifacts/libyuzu-android-unstripped.so
          if-no-files-found: error
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-EXP06-build-logs
          path: |
            artifacts/logs/
            build-exp06/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
