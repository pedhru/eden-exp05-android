name: Eden EXP05 Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER" || { echo "ERRO: sdkmanager não encontrado"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android toolchain
        run: |
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.5" \
            "ndk;28.2.13676358"

      - name: Install Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Generate Android debug keystore
        run: |
          keytool -delete -alias androiddebugkey -keystore src/android/app/debug.keystore -storepass android >/dev/null 2>&1 || true
          keytool -genkeypair -noprompt -keystore src/android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare SDL3 Java sources
        run: |
          set -e
          SDL_VERSION=3.2.28
          curl -fL --retry 3 -o /tmp/SDL3.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          mkdir -p externals/generated/sdl/java
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          test -f "/tmp/SDL3-${SDL_VERSION}/android-project/app/src/main/java/org/libsdl/app/SDL.java" || {
            echo "ERRO: SDL.java não encontrado na versão selecionada"
            exit 1
          }
          cp -R "/tmp/SDL3-${SDL_VERSION}/android-project/app/src/main/java/." \
            externals/generated/sdl/java/
          test -f externals/generated/sdl/java/org/libsdl/app/SDL.java

      - name: Build EXP05 Mainline Debug
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew copyMainlineDebugOutputs \
            --no-daemon \
            --max-workers=2 \
            --console=plain

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-EXP05-Android
          path: |
            artifacts/
            src/android/app/build/outputs/apk/
          if-no-files-found: warn
